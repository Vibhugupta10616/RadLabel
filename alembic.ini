# Alembic (README §6.5): migrations for the Postgres schema in src/radlabel/db/models.py.
# The URL comes from DATABASE_URL (config.py) in env.py, never from this file.
[alembic]
script_location = src/radlabel/db/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
