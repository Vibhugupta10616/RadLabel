services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radlabel
      POSTGRES_PASSWORD: radlabel
      POSTGRES_DB: radlabel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radlabel"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # The website (docker compose --profile site up --build -d web, then http://localhost:8080). Uploads stay in the api
  # process's memory; it needs no database. Mounted, never in the image: the private search model (falls back to the
  # base model with a warning if missing) and the cost-ledger directory (aggregate website spend rows, D22).
  api:
    profiles: [site]
    build: {context: ., dockerfile: deploy/api.Dockerfile}
    env_file: [{path: .env, required: false}]
    ports: ["8000:8000"]
    volumes:
      - ./models/serving:/app/models/serving:ro
      - ./artifacts/llm_cache:/app/artifacts/llm_cache
      - hf:/home/app/.cache/huggingface

  web:
    profiles: [site]
    build: {context: ., dockerfile: deploy/web.Dockerfile}
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  qdrant:
  hf:
