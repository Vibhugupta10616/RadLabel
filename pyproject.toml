[project]
name = "radlabel"
version = "0.1.0"
description = "Radiology report labelling, negation-aware hybrid search and a query agent (IU chest X-ray reports)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "openai>=1.60",
    "langgraph>=1.2",  # control flow of the per-report tiers only; model calls go through radlabel.llm
    "qdrant-client~=1.12.0",  # matches the qdrant/qdrant:v1.12.4 compose service
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # website session API (M10a)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
]

[project.optional-dependencies]
eval = [
    # pinned: negex behaviour is part of the frozen eval_v1 detector
    "spacy==3.8.16",
    "negspacy==1.1.0",
    "spacy-lookups-data==1.0.5",
    # folds (README §4.2); scikit-multilearn 0.2.0 is incompatible with scikit-learn >= 1.x seeding
    "iterative-stratification==0.1.9",
    "scikit-learn>=1.5",
]
# sentence embeddings: the verifier agent's find_by_meaning tool (M7), index + fine-tuning (M8, M9).
# Optional: tests use a fake encoder, so CI doesn't need it.
embed = [
    "sentence-transformers>=5.0",
]
# embedding fine-tuning (M9): trainer dependencies; local only, CI does not install it
train = [
    "sentence-transformers[train]>=5.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "types-PyYAML",
    "httpx>=0.27",  # FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radlabel"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "artifacts", "models", "data_prep/parse_iu.py", "data_prep/map_and_stats.py", "data_prep/coding_policy.py", "data_prep/subset_stats.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
exclude = ["src/radlabel/db/migrations/"]  # alembic scripts (revision files are not importable module names)
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
