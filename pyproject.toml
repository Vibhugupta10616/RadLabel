[project]
name = "radlabel"
version = "0.1.0"
description = "Radiology report labelling, negation-aware hybrid search and a query agent (IU chest X-ray reports)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "openai>=1.60",
    "langgraph>=1.2",  # control flow of the per-report tiers only; model calls go through radlabel.llm
]

[project.optional-dependencies]
eval = [
    # pinned: negex behaviour is part of the frozen eval_v1 detector
    "spacy==3.8.16",
    "negspacy==1.1.0",
    "spacy-lookups-data==1.0.5",
    # folds (README §4.2); scikit-multilearn 0.2.0 is incompatible with scikit-learn >= 1.x seeding
    "iterative-stratification==0.1.9",
    "scikit-learn>=1.5",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radlabel"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["data", "artifacts", "models", "data_prep/parse_iu.py", "data_prep/map_and_stats.py", "data_prep/coding_policy.py", "data_prep/subset_stats.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
