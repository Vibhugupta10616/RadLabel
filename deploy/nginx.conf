server {
    listen 80;
    root /usr/share/nginx/html;

    # 50 files of at most 2 MB (WEB_MAX_REPORTS, WEB_MAX_FILE_BYTES)
    client_max_body_size 110m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;  # labelling 50 reports takes minutes
    }

    location / {
        try_files $uri /index.html;  # client-side routes (/upload, /results)
    }
}
